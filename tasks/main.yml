---
- name: Install Git and minimal tools inside Docker
  ansible.builtin.apt:
    name: [git, ca-certificates]
    state: present
    update_cache: yes

- name: Create Vector system directory for configuration
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    mode: '0755'

- name: Clone Vector repository directly from GitHub
  ansible.builtin.git:
    repo: "https://github.com/vectordotdev/vector.git"
    dest: "/tmp/vector-src"
    version: master
    depth: 1

- name: Apply Vector template configuration from your role
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_dir }}/vector.yaml"
    mode: '0644'