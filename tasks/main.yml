---
- name: Download Vector package
  ansible.builtin.get_url:
    url: "https://timber.io{{ vector_version }}/vector-{{ vector_version }}-amd64.deb"
    dest: "/tmp/vector.deb"
    mode: '0644'

- name: Install Vector package
  ansible.builtin.apt:
    deb: "/tmp/vector.deb"
    state: present

- name: Apply Vector configuration
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_dir }}/vector.yaml"
    mode: '0644'
  notify: Restart Vector